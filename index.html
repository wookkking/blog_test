<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>액티브 시니어</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">액티브 시니어</a></h1>
            <nav>
                <ul>
                    <li><a href="health-shop.html">건강 장보기</a></li>
                    <li><a href="community.html">시니어 소통방</a></li>
                    <li><a href="health-care.html">건강 관리</a></li>
                    <li><a href="jobs.html">일자리 찾기</a></li>
                    <li><a href="leisure.html">여가 활동</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="main-grid">
            <!-- Main Content -->
            <div class="main-content">
                <div class="card welcome-card">
                    <div class="welcome-text">
                        <p>10월 24일 화요일</p>
                        <h2>안녕하세요, 길동님!</h2>
                    </div>
                    <div class="user-profile">
                        <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="User profile picture">
                        <button class="dark-mode-toggle">🌙</button>
                    </div>
                </div>

                <div class="action-cards">
                    <a href="health-shop.html" class="action-card">
                        <div class="card-icon-wrapper green">
                            <span>🛒</span>
                        </div>
                        <div class="action-card-text">
                            <h3>오늘의 알뜰 장보기</h3>
                            <p>최저가 상품을 확인하세요</p>
                        </div>
                    </a>
                    <a href="jobs.html" class="action-card">
                        <div class="card-icon-wrapper blue">
                            <span>💼</span>
                        </div>
                        <div class="action-card-text">
                            <h3>시니어 일자리 추천</h3>
                            <p>내 주변 일자리를 찾아보세요</p>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="card widget-card">
                    <div class="widget-header">
                        <h4>오늘의 걸음</h4>
                        <p>목표까지 1,550 걸음 남았어요!</p>
                    </div>
                    <div class="progress-circle" style="--progress: 69">
                        <span class="progress-circle-value">69%</span>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 액티브 시니어. All rights reserved.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
