<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>클리닉 콘텐츠 매뉴얼 생성기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="bg">
      <div class="grid"></div>
    </div>

    <header class="hero">
      <div class="hero-inner">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>MED CONTENT LAB</span>
        </div>
        <h1>클리닉 콘텐츠 매뉴얼 생성기</h1>
        <div class="hero-stats">
          <div>
            <strong>전문 구조 자동화</strong>
            <span>의학 정보 흐름 최적화</span>
          </div>
          <div>
            <strong>가독성 중심 작성</strong>
            <span>섹션별 핵심 요약</span>
          </div>
          <div>
            <strong>즉시 배포용 HTML</strong>
            <span>복사·다운로드 지원</span>
          </div>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="panel">
        <div class="panel-title">
          <h2>원고 입력</h2>
          <span>클리닉 정보와 주제만 입력하면 구조가 자동으로 완성됩니다.</span>
        </div>
        <form id="generator" class="form">
          <div class="field">
            <label for="clinic">클리닉명</label>
            <input id="clinic" name="clinic" placeholder="예: 라인뷰 클리닉" required />
          </div>
          <div class="field">
            <label for="service">진료 카테고리</label>
            <select id="service" name="service">
              <option value="성형외과">성형외과</option>
              <option value="피부과">피부과</option>
              <option value="성형외과·피부과">성형외과·피부과</option>
            </select>
          </div>
          <div class="field">
            <label for="treatment">주요 시술/수술명</label>
            <input
              id="treatment"
              name="treatment"
              placeholder="예: 리프팅 레이저, 눈매 교정"
              required
            />
          </div>
          <div class="field">
            <label for="topic">콘텐츠 주제</label>
            <input
              id="topic"
              name="topic"
              placeholder="예: 처진 피부에 맞는 리프팅 선택 가이드"
              required
            />
          </div>
          <div class="field">
            <label for="audience">핵심 타겟</label>
            <input id="audience" name="audience" placeholder="예: 30~40대 탄력 고민" />
          </div>
          <div class="field">
            <label for="tone">브랜드 톤</label>
            <select id="tone" name="tone">
              <option value="전문적이면서도 이해하기 쉬운">전문적이면서도 이해하기 쉬운</option>
              <option value="차분하고 신뢰감 있는">차분하고 신뢰감 있는</option>
              <option value="논리적이고 정제된">논리적이고 정제된</option>
              <option value="친절하고 공감하는">친절하고 공감하는</option>
            </select>
          </div>
          <div class="field">
            <label for="length">분량</label>
            <div class="radio-group">
              <label><input type="radio" name="length" value="short" />간단</label>
              <label><input type="radio" name="length" value="medium" checked />표준</label>
              <label><input type="radio" name="length" value="long" />심화</label>
            </div>
          </div>
          <div class="field">
            <label for="keywords">보조 키워드(쉼표 구분)</label>
            <input
              id="keywords"
              name="keywords"
              placeholder="예: 리프팅, 레이저, 탄력, 피부"
            />
          </div>
          <div class="field">
            <label for="location">지역 포인트</label>
            <input id="location" name="location" placeholder="예: 강남, 분당" />
          </div>
          <div class="actions">
            <button type="submit" class="primary">원고 생성</button>
            <button type="button" id="reset" class="ghost">초기화</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>HTML 원고</h2>
          <span>복사 후 블로그 편집기에 그대로 붙여 넣으세요.</span>
        </div>
        <div class="panel-actions">
          <button id="copy" class="ghost" type="button">HTML 복사</button>
          <button id="download" class="primary" type="button">HTML 다운로드</button>
        </div>
        <textarea id="htmlOutput" class="code" readonly></textarea>
      </section>
    </main>

    <footer class="footer">
      <div>본 문서는 일반 정보 제공을 위한 초안이며, 개별 진료는 의료진 상담 후 결정됩니다.</div>
    </footer>

    <script defer type="text/javascript" src="./main.js"></script>
  </body>
</html>
