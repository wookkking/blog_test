<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 몸 지키미 - 액티브 시니어</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1><a href="index.html">액티브 시니어</a></h1>
        <nav>
            <ul>
                <li><a href="health-shop.html">건강 장보기</a></li>
                <li><a href="community.html">시니어 소통방</a></li>
                <li><a href="health-care.html">건강 관리</a></li>
                <li><a href="jobs.html">일자리 찾기</a></li>
                <li><a href="leisure.html">여가 활동</a></li>
            </ul>
        </nav>
    </header>

    <main class="health-dashboard">
        <div class="page-title">
            <h2>내 몸 지키미</h2>
            <span>🔔</span>
        </div>

        <section class="medication-tracker">
            <div class="section-header">
                <h4>약 먹기</h4>
                <a href="#" class="view-all">전체 보기</a>
            </div>
            <div class="med-item completed">
                <div class="item-icon pill-blue">💊</div>
                <div class="item-text">
                    <p>아침 약</p>
                    <span>식후 30분 • 2알</span>
                </div>
                <button class="status-btn completed-btn">✓ 복용</button>
            </div>
            <div class="med-item">
                <div class="item-icon pill-gray">💊</div>
                <div class="item-text">
                    <p>점심 약</p>
                    <span>식후 30분 • 1알</span>
                </div>
                <button class="status-btn">완료</button>
            </div>
        </section>

        <section class="health-metrics">
            <div class="metric-card blood-pressure">
                <div class="metric-header">
                    <span>❤️ 혈압</span>
                </div>
                <div class="metric-value">
                    <p><strong>120</strong> /80</p>
                    <span>오늘 오전 8:00</span>
                </div>
                <button class="record-btn">+ 기록하기</button>
            </div>
            <div class="metric-card blood-sugar">
                <div class="metric-header">
                    <span>💧 혈당</span>
                </div>
                <div class="metric-value">
                    <p><strong>95</strong> mg/dL</p>
                    <span>식전</span>
                </div>
                <button class="record-btn">+ 기록하기</button>
            </div>
        </section>

        <section class="weekly-trend">
            <div class="section-header">
                <h4>주간 건강 변화</h4>
                <span>...</span>
            </div>
            <p class="chart-subtitle">지난 7일간의 기록입니다.</p>
            <canvas id="healthChart"></canvas>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 액티브 시니어. All rights reserved.</p>
    </footer>
    <script src="health-care.js"></script>
</body>
</html>
