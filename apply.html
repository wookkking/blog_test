<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>작가 등록 — SNAP.SPECTRUM</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="noise"></div>
    <header class="hero">
      <nav class="nav">
        <a class="logo" href="index.html">SNAP.SPECTRUM</a>
        <div class="nav-links">
          <a href="browse.html">작가 둘러보기</a>
          <a href="index.html#how">이용 방법</a>
          <a href="support.html">문의</a>
          <a href="apply.html" class="cta">작가 등록</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="page-hero section">
        <p class="eyebrow">ARTIST APPLICATION</p>
        <h1>전문 작가 등록</h1>
        <p>프로필 검수 후 24시간 내에 등록 결과를 안내합니다.</p>
      </section>

      <section class="section">
        <div class="panel">
          <h3>기본 정보 입력</h3>
          <div class="form-grid">
            <label>
              작가명
              <input type="text" placeholder="예: 민스튜디오" />
            </label>
            <label>
              이메일
              <input type="email" placeholder="example@email.com" />
            </label>
            <label>
              주 촬영 카테고리
              <select>
                <option>국내 야외 스냅</option>
                <option>해외 야외 스냅</option>
                <option>웨딩/스튜디오</option>
                <option>푸드 전문</option>
              </select>
            </label>
            <label>
              활동 지역
              <input type="text" placeholder="서울 / 제주 / 해외" />
            </label>
          </div>
          <label style="margin-top: 1.2rem;">
            소개글
            <textarea placeholder="작가의 스타일과 촬영 경험을 소개해주세요."></textarea>
          </label>
          <div class="action-row" style="margin-top: 1.5rem;">
            <a class="btn primary" href="apply-submitted.html">등록 신청</a>
            <a class="btn ghost" href="support.html">상담 문의</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div>
        <strong>SNAP.SPECTRUM</strong>
        <p>사진작가와 소비자를 연결하는 비교 플랫폼</p>
      </div>
      <div class="footer-links">
        <a href="terms.html">이용약관</a>
        <a href="privacy.html">개인정보처리방침</a>
        <a href="support.html">고객센터</a>
      </div>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
